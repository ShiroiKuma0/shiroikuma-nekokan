# --- shiroikuma-nekokan fork versioning ---
# VERSION_NAME / VERSION_CODE track upstream (CatimaLoyalty/Android). BUILD_NUMBER is our
# fork increment, bumped by the buildApk task on every build and reset to 1 on each new
# upstream version (see the upstream-new-version skill).
# Fork versionName = "<VERSION_NAME>+<BUILD_NUMBER>";
# versionCode = VERSION_CODE * 10000 + BUILD_NUMBER   (Catima 167 -> 1670000 + N).
VERSION_NAME=2.43.0
VERSION_CODE=167
BUILD_NUMBER=11
APP_ID=shiroikuma.nekokan
APP_NAMESPACE=protect.card_locker